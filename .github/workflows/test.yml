name: Run test jobs
on:
  pull_request:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: plus3it/actions-workflows/.github/workflows/test.yml@ce3cef72cf4ac9605a29350d1d4387dfb86cd7a8

  linux:
    uses: plus3it/actions-workflows/.github/workflows/test-salt-linux.yml@00ff10246f901f01818db412fa99124dbed4a00c
    strategy:
      matrix:
        os_version:
          - 8
          - 9
        salt_state:
          - dbeaver-dbms
        salt_pillar_root:
          - ./tests/pillar/test-linux-main
    with:
      salt-os-version: ${{ matrix.os_version }}
      salt-state: ${{ matrix.salt_state }}
      salt-pillar-root: ${{ matrix.salt_pillar_root }}
