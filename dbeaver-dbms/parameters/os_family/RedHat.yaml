# -*- coding: utf-8 -*-
# vim: ft=yaml
#
# Set values specific to:
#   salt['config.get']('os_family') == RedHat.
#
# You just need to add the key:values for this `os_family` that differ
# from `defaults.yaml` + `<osarch>.yaml`.
#
# If you do not need to provide defaults via the `os_family` config,
# you can remove this file or provide at least an empty dict, e.g.
# values: {}
---
values:
  pkg:
    # Default to community edition RPM-name, but any of:
    # * Light:      dbeaver-le
    # * Enterprise: dbeaver-ee
    # * Ultimate:   dbeaver-ue
    # Are valid
    name: 'dbeaver-ce'
    # Default to community edition URL, but any of:
    # * Light:      https://dbeaver.com/files/dbeaver-le-latest-linux-x86_64.rpm
    # * Enterprise: https://dbeaver.com/files/dbeaver-ee-latest-linux-x86_64.rpm
    # * Ultimate:   https://dbeaver.com/files/dbeaver-ue-latest-linux-x86_64.rpm
    # Are valid
    download_uri: 'https://dbeaver.io/files/dbeaver-ce-latest-linux-x86_64.rpm'
  config_dir: '/etc/dbeaver-dbms'
...
